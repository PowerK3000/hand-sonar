# Webcam hand-control gesture map (agreed 2026-10-22). Numbers are starting points; they get
# tuned against recordings of Kayden's real hand once the camera arrives.
# Distances are in hand-size units (1.0 = wrist to middle-finger knuckle), so the same values
# work at any distance or angle from the camera.

[app]
camera_index = 0
model_path = "models/hand_landmarker.task"
hand = "any"                      # "left", "right" or "any"
num_hands = 1                     # 1 = fastest: with 2, the hand detector re-runs every frame looking for a second hand
process_width = 640               # frames are downscaled to this width before tracking (720p -> 640x360: 25 vs 15 fps on this PC)
pause_hotkey = "ctrl+alt+h"

[taps]
# How clicks are detected.
#   "model": personal motion model trained on your recordings (python -m handctl.train_taps).
#            Thumb contact is often hidden from an overhead camera; the model reads the motion
#            of the whole visible hand instead. Drag is not supported in this mode yet.
#   "pinch": thumb-finger distance thresholds ([gestures.click] etc.); needs a clear view.
#   "lift":  index fingertip lift = left click, middle lift = right click (training-free; chosen
#            2026-10-22 because a lift is ~8.7x rest jitter from an overhead camera vs ~3.6x for a
#            thumb tap). Middle lift is not yet validated on recordings.
mode = "pinch"                    # front/side camera sees thumb-finger contact directly; "lift"/"model" were overhead-camera workarounds
model_path = "models/tap_model.joblib"
left_threshold = 0.7              # held-out t1 (ensemble): left 12/16, right 16/17, 0 false triggers
right_threshold = 0.4
refractory_s = 1.0                # minimum time between clicks; 0.6 let one tap fire twice live (2026-10-22)
rewind_s = 0.3                    # the model recognises a tap ~0.1-0.3 s late: undo cursor drift since then

[engagement]
# Control is only live while engaged; stops typing/reaching from firing actions.
disengage_on_keyboard = true      # any physical key press disengages instantly
disengage_on_mouse = true         # touching the real mouse disengages instantly
reengage_after_ms = 400           # keyboard/mouse must be idle this long before hands count again
min_confidence = 0.6              # ignore frames where the tracker is unsure

[filter]
# One Euro filter: low jitter when the hand is still, low lag when it moves fast.
# Applied to landmarks in hand lengths, so beta is "extra Hz per hand-length/s of speed".
# Gesture filter (pinch distances, finger straightness): light, so quick taps survive. At 1.2 Hz /
# beta 1.0 a 100 ms tap only reached 0.14-0.16 vs the 0.16 threshold (live: "really unresponsive").
min_cutoff_hz = 4.0
beta = 3.0
# The cursor's palm signal is already stabilised (handctl/stabilize.py) and leashed, so its own
# filter only needs to be light: at beta 1.0 it added ~70 ms of lag on slow moves (2026-10-22).
palm_min_cutoff_hz = 1.2           # lighter settings (3.0 / 8.0) brought jitter back live (2026-10-22)
palm_beta = 1.0
d_cutoff_hz = 1.0

[poses]
extended_min = 0.9                # finger straightness (tip-to-knuckle / bone length) to count as extended
curled_max = 0.62                 # ...and below this to count as curled

[pointer]
# Which hand motion drives each cursor axis depends on camera placement. Set by hand from live
# feedback (2026-10-22, side camera): axis_check picked swapped axes from a diagonal test motion.
# `python -m handctl.axis_check`
# measures it (move right once, raise hand once) and rewrites these four lines.
# Sources: image_x / image_y (hand moving across the picture), height (hand getting closer = bigger).
horizontal_source = "image_x"
horizontal_sign = -1.0
vertical_source = "image_y"
vertical_sign = 1.0
                                  # "image_y": push hand toward/away from the monitor
height_gain = 5.0                 # hand-length-equivalents per unit of log palm size (~10 cm raise = ~1 hand length of travel)
smooth_ms = 25                    # cursor glides toward each new target at 125 Hz instead of jumping per camera frame
# Cursor follows the whole hand (palm centre), relative like a trackpad. Motion is measured in
# hand lengths, so moving one hand-length gives the same cursor travel at any camera distance.
pixels_per_hand = 450             # cursor travel for one hand-length of motion at slow speed (was 700: too twitchy live)
acceleration = 2.0                # >1 = fast moves travel further (1 = linear)
accel_ref_hands_per_s = 1.0       # speed where acceleration starts to kick in
deadzone = 0.04                   # leash radius in hand lengths: the cursor ignores palm jitter inside it

[gestures.click]
action = "left_click"
pose = "thumb_index_pinch"
# Front camera (front1, 2026-10-22): in the IMAGE every tap reached 0.05-0.16 while between taps
# stayed >= 0.29; MediaPipe's 3D gap only reached 0.13-0.39, so the old 3D threshold 0.16 missed
# most taps ("unresponsive"). Distances in image hand lengths (wrist -> middle knuckle).
metric = "2d"
pinch_close = 0.20
pinch_open = 0.27                 # must open past this to release (hysteresis, no double fires)
arm_s = 0.1
snap_s = 0.25
still_max = 1.5                   # hand moving faster than this (hand lengths/s): no new presses

[gestures.right_click]
action = "right_click"
pose = "thumb_middle_pinch"
metric = "2d"
pinch_close = 0.21                # right taps reached 0.05-0.23 in the image; between taps median ~0.30
pinch_open = 0.25                 # 0.29 was rarely re-crossed between right taps (18 vs 11 of 32 hit, front1 replay)
arm_s = 0.1
snap_s = 0.25
still_max = 1.5

[gestures.drag]
# Pinch, hold, move, release: e.g. dragging a browser tab.
action = "left_drag"
pose = "thumb_index_pinch"
# Pinch = button held (pressed on touch, released on part). The cursor stays frozen while pressed
# until the hand moves this far (hand lengths) since the touch, then it drags.
start_move = 0.3

[gestures.scroll]
# iPhone-style: slide the extended index finger; the content follows the finger.
# Finger up -> content moves up -> page scrolls down (and vice versa).
action = "scroll"
pose = "index_extended"           # index out; middle, ring and pinky curled
hold_ms = 150                     # pose must be held this long first: passing through it on the way into a pinch scrolled (live)
natural = true
vertical_axis = "palm_forward"    # which finger motion counts as "up": palm_forward | palm_normal
horizontal = true                 # sideways slide = horizontal scroll
wheel_per_hand = 1200             # wheel units (120 = one notch) per hand-length of fingertip travel
momentum = true                   # a quick flick keeps coasting and decays, like iOS
momentum_decay_per_s = 0.006      # fraction of speed left after 1 s of coasting
momentum_min_wheel_per_s = 60     # below this speed coasting stops

[gestures.clutch]
# "Lift the mouse": while you hold a fist the cursor stays put, so you can reposition your hand
# when you run out of room (like lifting a mouse at the edge of the pad). Open the hand to resume.
enabled = true
max_straightness = 0.75           # every finger at least this curled counts as a fist

[gestures.wake]
action = "wake"                   # show the pointer overlay / wake the screen
pose = "open_palm_still"             # fingers straight AND spread wide (a resting hand never is)
enabled = false                   # off: fired 14x falsely in the first live run (2026-10-22); needs redesign
hold_ms = 800
max_speed_hands_per_s = 0.15
min_spread_deg = 25
