# Webcam hand-control gesture map (agreed 2026-10-22). Numbers are starting points; they get
# tuned against recordings of Kayden's real hand once the camera arrives.
# Distances are in hand-size units (1.0 = wrist to middle-finger knuckle), so the same values
# work at any distance or angle from the camera.

[app]
camera_index = 0
model_path = "models/hand_landmarker.task"
hand = "any"                      # "left", "right" or "any"
num_hands = 1                     # 1 = fastest: with 2, the hand detector re-runs every frame looking for a second hand
process_width = 640               # frames are downscaled to this width before tracking (720p -> 640x360: 25 vs 15 fps on this PC)
pause_hotkey = "ctrl+alt+h"

[taps]
# How clicks are detected.
#   "model": personal motion model trained on your recordings (python -m handctl.train_taps).
#            Thumb contact is often hidden from an overhead camera; the model reads the motion
#            of the whole visible hand instead. Drag is not supported in this mode yet.
#   "pinch": thumb-finger distance thresholds ([gestures.click] etc.); needs a clear view.
mode = "model"
model_path = "models/tap_model.joblib"
left_threshold = 0.7              # held-out t1 (ensemble): left 12/16, right 16/17, 0 false triggers
right_threshold = 0.4
refractory_s = 0.6                # minimum time between clicks (one tap can't double-click)
rewind_s = 0.3                    # the model recognises a tap ~0.1-0.3 s late: undo cursor drift since then

[engagement]
# Control is only live while engaged; stops typing/reaching from firing actions.
disengage_on_keyboard = true      # any physical key press disengages instantly
disengage_on_mouse = true         # touching the real mouse disengages instantly
reengage_after_ms = 400           # keyboard/mouse must be idle this long before hands count again
min_confidence = 0.6              # ignore frames where the tracker is unsure

[filter]
# One Euro filter: low jitter when the hand is still, low lag when it moves fast.
# Applied to landmarks in hand lengths, so beta is "extra Hz per hand-length/s of speed".
min_cutoff_hz = 1.2
beta = 1.0
d_cutoff_hz = 1.0

[poses]
extended_min = 0.85               # finger straightness (tip-to-knuckle / bone length) to count as extended
curled_max = 0.70                 # ...and below this to count as curled

[pointer]
# Cursor follows the whole hand (palm centre), relative like a trackpad. Motion is measured in
# hand lengths, so moving one hand-length gives the same cursor travel at any camera distance.
mirror = true                     # webcam faces you: your right = camera's left
pixels_per_hand = 700             # cursor travel for one hand-length of motion at slow speed
acceleration = 1.6                # >1 = fast moves travel further (1 = linear)
accel_ref_hands_per_s = 1.0       # speed where acceleration starts to kick in
deadzone = 0.01                   # hand lengths per frame; kills jitter at rest

[gestures.click]
action = "left_click"
pose = "thumb_index_pinch"
pinch_close = 0.16                # thumb-index tip distance to count as touching (live taps reached 0.07-0.13)
pinch_open = 0.26                 # must open past this to release (hysteresis, no double fires)
# Released before drag.start_after_ms without moving drag.start_move -> click; otherwise drag.

[gestures.right_click]
action = "right_click"
pose = "thumb_middle_pinch"
pinch_close = 0.16
pinch_open = 0.26
max_hold_ms = 600                 # held longer than this = cancelled, no right click

[gestures.drag]
# Pinch, hold, move, release: e.g. dragging a browser tab.
action = "left_drag"
pose = "thumb_index_pinch"
start_after_ms = 400              # live taps lasted 0.1-0.3 s
start_move = 0.15                 # net hand travel (hand lengths) since the pinch closed

[gestures.scroll]
# iPhone-style: slide the extended index finger; the content follows the finger.
# Finger up -> content moves up -> page scrolls down (and vice versa).
action = "scroll"
pose = "index_extended"           # index out; middle, ring and pinky curled
natural = true
vertical_axis = "palm_forward"    # which finger motion counts as "up": palm_forward | palm_normal
horizontal = true                 # sideways slide = horizontal scroll
wheel_per_hand = 1200             # wheel units (120 = one notch) per hand-length of fingertip travel
momentum = true                   # a quick flick keeps coasting and decays, like iOS
momentum_decay_per_s = 0.006      # fraction of speed left after 1 s of coasting
momentum_min_wheel_per_s = 60     # below this speed coasting stops

[gestures.wake]
action = "wake"                   # show the pointer overlay / wake the screen
pose = "open_palm_still"             # fingers straight AND spread wide (a resting hand never is)
enabled = false                   # off: fired 14x falsely in the first live run (2026-10-22); needs redesign
hold_ms = 800
max_speed_hands_per_s = 0.15
min_spread_deg = 25
